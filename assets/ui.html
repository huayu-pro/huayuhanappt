<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>华予&Hanako PPT · 本地生成器</title>
<style>
  :root {
    --primary: #8BA7C7;
    --accent: #6B8FA3;
    --bg: #F5F7FA;
    --card: #FFFFFF;
    --text: #3D4A55;
    --muted: #8A97A3;
    --border: #E2E8EE;
    --ok: #059669;
    --warn: #B45309;
    --err: #B91C1C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
  }
  header {
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: #fff; padding: 20px 28px;
  }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .9; }
  main { max-width: 1180px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 18px;
  }
  .card h2 {
    margin: 0 0 12px; font-size: 15px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .step {
    display: inline-flex; width: 22px; height: 22px; border-radius: 50%;
    background: var(--primary); color: #fff; font-size: 12px;
    align-items: center; justify-content: center; flex: none;
  }
  textarea, input[type=text], input[type=number], select {
    width: 100%; padding: 9px 11px; border: 1px solid var(--border);
    border-radius: 7px; font-size: 14px; font-family: inherit;
    background: #fff; color: var(--text);
  }
  textarea { min-height: 190px; resize: vertical; line-height: 1.7; }
  textarea:focus, input:focus, select:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  label { display: block; font-size: 13px; font-weight: 500; margin: 12px 0 5px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button {
    background: var(--primary); color: #fff; border: none; border-radius: 7px;
    padding: 10px 18px; font-size: 14px; font-weight: 500; cursor: pointer;
    font-family: inherit;
  }
  button:hover { filter: brightness(1.06); }
  button.ghost { background: #fff; color: var(--accent); border: 1px solid var(--primary); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .provider {
    display: flex; align-items: center; gap: 10px; padding: 9px 0;
    border-bottom: 1px dashed var(--border); font-size: 13px;
  }
  .provider:last-child { border-bottom: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted); }
  .dot.ok { background: var(--ok); }
  .dot.no { background: #D1D5DB; }
  .provider .name { flex: 1; }
  .provider a { color: var(--accent); font-size: 12px; text-decoration: none; }
  .keyrow { display: grid; grid-template-columns: 150px 1fr; gap: 8px; align-items: center; margin: 7px 0; }
  .keyrow label { margin: 0; font-size: 12px; color: var(--muted); font-family: ui-monospace, monospace; }
  .keyrow input { font-size: 13px; padding: 7px 9px; }
  .themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .theme {
    border: 2px solid var(--border); border-radius: 8px; padding: 8px;
    cursor: pointer; text-align: center; font-size: 12px;
  }
  .theme.active { border-color: var(--primary); background: #F0F5FA; }
  .swatches { display: flex; gap: 3px; margin-bottom: 5px; }
  .swatches i { flex: 1; height: 14px; border-radius: 3px; }
  #status { font-size: 13px; padding: 10px 12px; border-radius: 7px; margin-top: 12px; display: none; }
  #status.show { display: block; }
  #status.ok { background: #ECFDF5; color: #065F46; border: 1px solid #A7F3D0; }
  #status.warn { background: #FFFBEB; color: #92400E; border: 1px solid #FDE68A; }
  #status.err { background: #FEF2F2; color: #991B1B; border: 1px solid #FECACA; }
  #outline { max-height: 320px; overflow: auto; font-size: 12.5px; }
  #outline table { width: 100%; border-collapse: collapse; }
  #outline td { padding: 4px 6px; border-bottom: 1px solid #F1F5F9; }
  #outline td.n { color: var(--muted); width: 34px; text-align: right; }
  .tag { font-size: 10px; padding: 1px 6px; border-radius: 8px; background: #EEF2F6; color: var(--muted); margin-left: 5px; }
  .tag.chart { background: #DBEAFE; color: #1E40AF; }
  .tag.img { background: #FEF3C7; color: #92400E; }
  .full { grid-column: 1 / -1; }
  pre {
    background: #1E1E1E; color: #D4D4D4; padding: 11px 13px; border-radius: 7px;
    font-size: 12px; overflow: auto; margin: 8px 0 0;
  }
</style>
</head>
<body>
<header>
  <h1>华予&Hanako PPT · 本地生成器</h1>
  <p>粘贴文稿 → 设参数 → 生成 PPT。所有数据只在本机处理，不外传。</p>
</header>

<main>
  <section class="card">
    <h2><span class="step">1</span>粘贴文稿</h2>
    <textarea id="text" placeholder="把论文、报告或讲稿正文粘贴到这里……&#10;&#10;支持「一、」「1.」「第一部分」等章节标记，脚本会据此拆分页面；&#10;出现「XX 45%」这类数据时会自动生成图表。"></textarea>
    <div class="hint" id="charCount">上限 200000 字</div>

    <label>演示信息</label>
    <div class="row">
      <input type="text" id="mTitle" placeholder="演示标题（留取文稿首行）">
      <input type="text" id="mPresenter" placeholder="汇报人">
    </div>
    <div class="row" style="margin-top:8px">
      <input type="text" id="mInstitution" placeholder="院校 / 单位">
      <input type="text" id="mDate" placeholder="日期">
    </div>

    <label>目标页数</label>
    <div class="row">
      <input type="number" id="pages" value="25" min="8" max="40">
      <select id="theme"></select>
    </div>
    <div class="hint">页数范围 8–40，学术汇报推荐 25–30 页。超出时脚本会自动合并或裁剪内容。</div>

    <div class="actions">
      <button id="btnOutline">预览页面大纲</button>
      <button id="btnGen" class="ghost">生成 PPT</button>
      <button id="btnSkip" class="ghost">不配图，直接生成</button>
    </div>
    <div id="status"></div>
  </section>

  <section class="card">
    <h2><span class="step">2</span>配图密钥配置</h2>
    <div id="providers"></div>
    <div id="keyForm"></div>
    <div class="actions">
      <button id="btnSaveKeys">保存密钥到 .env</button>
    </div>
    <div class="hint">
      密钥只写入本机 .env 文件（权限 0600），不会上传到任何服务器。<br>
      一个密钥都不配也能生成——Bing 与 Wikimedia 免密钥，关掉配图则完全离线。
    </div>
  </section>

  <section class="card full">
    <h2><span class="step">3</span>页面大纲与产物</h2>
    <div id="outline"><span class="hint">点击「预览页面大纲」后这里会列出每一页的标题、类型与是否含图表/配图。</span></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const state = { themes: [], providers: [], theme: 'morandi_blue', maxChars: 200000 };

// ---- 初始化 ----
async function init() {
  try {
    const [themes, cfg, examples] = await Promise.all([
      fetch('/api/themes').then(r => r.json()),
      fetch('/api/config').then(r => r.json()),
      fetch('/api/examples').then(r => r.json()),
    ]);
    state.themes = themes.themes;
    state.providers = cfg.providers;
    state.maxChars = cfg.limits.max_input_chars;

    const sel = $('theme');
    sel.innerHTML = state.themes.map(t =>
      `<option value="${escapeHtml(t.name)}"${t.name === state.theme ? ' selected' : ''}>${escapeHtml(t.display)}</option>`
    ).join('');
    sel.onchange = () => { state.theme = sel.value; };

    renderProviders();
    renderKeyForm();

    if (examples.examples.length) {
      $('text').placeholder = '把论文、报告或讲稿正文粘贴到这里……\n\n也可以先用内置样例试跑：' +
        examples.examples.map(e => `${e.name}（${e.pages}页）`).join('、');
    }
    $('charCount').textContent = `上限 ${state.maxChars} 字`;
  } catch (e) {
    showStatus('err', '界面初始化失败：' + escapeHtml(e.message) +
      '。请刷新页面重试；若持续失败，重启 start_ui.py。');
  }
}

function renderProviders() {
  $('providers').innerHTML = state.providers.map(p => `
    <div class="provider">
      <span class="dot ${p.needs_key ? (p.configured ? 'ok' : 'no') : 'ok'}"></span>
      <span class="name">${p.label}</span>
      ${p.needs_key
        ? (p.configured ? '<span style="color:var(--ok);font-size:12px">已配置</span>'
                        : '<span style="color:var(--muted);font-size:12px">未配置</span>')
        : '<span style="color:var(--ok);font-size:12px">免密钥</span>'}
    </div>`).join('');
}

function renderKeyForm() {
  const needKey = state.providers.filter(p => p.needs_key);
  if (!needKey.length) { $('keyForm').innerHTML = ''; return; }
  let html = '';
  needKey.forEach(p => {
    p.variables.forEach((v, i) => {
      html += `<div class="keyrow">
        <label>${v}</label>
        <input type="text" id="key_${v}" placeholder="${p.configured ? '已配置（留空则不修改）' : '粘贴密钥'}"
               data-var="${v}" ${p.configured ? '' : 'autocomplete="off"'}>
      </div>`;
      const src = p.sources[i];
      if (src) html += `<div class="hint" style="margin:-4px 0 6px 158px">申请地址：<a href="${src}" target="_blank" rel="noopener" style="color:var(--accent)">${src}</a></div>`;
    });
  });
  $('keyForm').innerHTML = html;
}

function showStatus(kind, html) {
  const el = $('status');
  el.className = 'show ' + kind;
  el.innerHTML = html;
}

// ---- 大纲 ----
$('btnOutline').onclick = async () => {
  const text = $('text').value.trim();
  if (!text) { showStatus('err', '请先粘贴文稿。'); return; }
  $('btnOutline').disabled = true;
  showStatus('warn', '正在分析文稿结构……');
  try {
    const res = await fetch('/api/outline', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ text, pages: +$('pages').value || 25 }),
    }).then(r => r.json());
    if (!res.ok) { showStatus('err', escapeHtml(res.error)); return; }
    renderOutline(res.slides);
    showStatus('ok', `已解析出 ${res.count} 页。确认后点「生成 PPT」。`);
  } catch (e) {
    showStatus('err', '请求失败：' + e.message);
  } finally {
    $('btnOutline').disabled = false;
  }
};

function renderOutline(slides) {
  const rows = slides.map(s => `<tr>
    <td class="n">${s.page}</td>
    <td>${escapeHtml(s.title)}</td>
    <td style="white-space:nowrap">
      <span class="tag">${typeName(s.type)}</span>
      ${s.has_chart ? '<span class="tag chart">图表</span>' : ''}
      ${s.has_image ? '<span class="tag img">配图</span>' : ''}
    </td>
  </tr>`).join('');
  $('outline').innerHTML = `<table>${rows}</table>`;
}

function typeName(t) {
  return { title: '封面', section: '章节', content: '正文',
           data: '数据', reference: '文献', thank: '致谢' }[t] || t;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

// ---- 密钥保存 ----
$('btnSaveKeys').onclick = async () => {
  const keys = {};
  document.querySelectorAll('[data-var]').forEach(el => {
    const v = el.value.trim();
    if (v) keys[el.dataset.var] = v;
  });
  if (!Object.keys(keys).length) {
    showStatus('warn', '没有填写任何密钥。'); return;
  }
  const btn = $('btnSaveKeys');
  btn.disabled = true;
  try {
    const res = await fetch('/api/keys', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ keys }),
    }).then(r => r.json());
    if (res.ok) {
      showStatus('ok', escapeHtml(res.message) + '。刷新页面后状态会更新。');
      document.querySelectorAll('[data-var]').forEach(el => el.value = '');
    } else {
      showStatus('err', escapeHtml(res.error || '保存失败'));
    }
  } catch (e) {
    showStatus('err', '保存失败：' + escapeHtml(e.message));
  } finally {
    btn.disabled = false;
  }
};

// ---- 生成 ----
async function generate(skipImages) {
  const text = $('text').value.trim();
  if (!text) { showStatus('err', '请先粘贴文稿。'); return; }
  const btns = ['btnGen', 'btnSkip', 'btnOutline'].map($);
  btns.forEach(b => b.disabled = true);
  showStatus('warn', skipImages
    ? '正在排版生成（不爬配图）……'
    : '正在分析文稿、爬取配图并生成 PPT，配图较多时可能要一两分钟……');
  try {
    const res = await fetch('/api/generate', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        text, pages: +$('pages').value || 25,
        theme: state.theme, skip_images: skipImages,
        meta: {
          title: $('mTitle').value.trim(),
          presenter: $('mPresenter').value.trim(),
          institution: $('mInstitution').value.trim(),
          date: $('mDate').value.trim(),
        },
      }),
    }).then(r => r.json());

    if (!res.ok) {
      // 服务端错误可能回显用户输入（主题名、文件名），一律按文本处理
      let html = escapeHtml(res.error || '生成失败');
      if (res.details) html += '<pre>' + escapeHtml(res.details.join('\n')) + '</pre>';
      showStatus('err', html);
      return;
    }
    renderOutline(res.slides);
    let html = `<strong>已生成 ${res.pages} 页</strong>（${res.theme}，${res.images} 张配图，${res.elapsed}s）<br>`
      + `文件位置：<code>${escapeHtml(res.output)}</code>`;
    if (res.image_failures && res.image_failures.length) {
      html += `<br><br>${res.image_failures.length} 个关键词没找到配图（这些页已按无图版式渲染，不影响完整性）：`
        + `<pre>${escapeHtml(res.image_failures.slice(0, 8).map(f =>
            `第 ${f.page_num} 页「${f.keyword}」：${f.reason}`).join('\n'))}</pre>`;
    }
    if (res.warnings && res.warnings.length) {
      html += `<pre>${escapeHtml(res.warnings.slice(0, 8).join('\n'))}</pre>`;
    }
    showStatus('ok', html);
  } catch (e) {
    showStatus('err', '请求失败：' + e.message);
  } finally {
    btns.forEach(b => b.disabled = false);
  }
}

$('btnGen').onclick = () => generate(false);
$('btnSkip').onclick = () => generate(true);

$('text').addEventListener('input', () => {
  const n = $('text').value.length;
  $('charCount').textContent = `${n} / ${state.maxChars} 字`;
});

init();
</script>
</body>
</html>
